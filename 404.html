<title>404 — الصفحة غير موجودة | Alpha Comix</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#08080c;color:#ede9e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(circle at 20% 30%,rgba(239,63,86,.15),transparent 40%),radial-gradient(circle at 80% 70%,rgba(201,169,97,.15),transparent 40%)}
.box{text-align:center;max-width:520px}
img{width:120px;height:120px;border-radius:50%;border:2px solid #c9a961;margin:0 auto 24px;display:block;background:#000;box-shadow:0 0 40px rgba(239,63,86,.4)}
h1{font-family:'Lalezar',sans-serif;font-weight:400;font-size:6rem;color:#ef3f56;line-height:1;text-shadow:0 0 30px rgba(239,63,86,.6)}
h2{font-size:1.4rem;color:#e0c88a;margin:16px 0 10px}
p{color:#a8a49a;line-height:2;margin-bottom:28px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#e0c88a,#c9a961,#8b6f2f);color:#1a1200;font-weight:900;text-decoration:none;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;font-size:.82rem;transition:all .3s}
a.ghost{background:transparent;color:#c9a961;border:1px solid #c9a961}
a:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(201,169,97,.4)}
</style>
</head>
<body>
<div class="box">
<img src="logo.png" alt="Alpha Comix">

<p>عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.<br>يمكنك العودة إلى الصفحة الرئيسية واستكشاف الأعمال.</p>
<div class="actions">
<a href="/">← العودة للرئيسية</a>
<a href="/#/comics" class="ghost">تصفح الكوميكس</a>
</div>
</div>
</body>
</html>
